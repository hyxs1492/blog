<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 450" width="780" height="450"
     font-family="'DM Sans', -apple-system, system-ui, sans-serif">
  <rect width="780" height="450" fill="#0F172A"/>

  <!-- 允许侧（含 v_A 的那一侧） -->
  <path d="M315.1 0 L574.8 450 L780 450 L780 0 Z" fill="#3B82F6" fill-opacity="0.16" stroke="none"/>

  <!-- VO = 圆锥（顶点 v_B）+ 朝向顶点的截断圆弧 -->
  <path d="M306.6 205 A100 100 0 0 1 133.4 205 L15 0 L425 0 Z"
        fill="#EF4444" fill-opacity="0.20" stroke="none"/>
  <circle cx="220" cy="155" r="100" fill="none" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="7 5"/>
  <line x1="220" y1="355" x2="425" y2="0" stroke="#F59E0B" stroke-width="2.2"/>
  <line x1="220" y1="355" x2="15" y2="0" stroke="#F59E0B" stroke-width="2.2"/>
  <path d="M306.6 205 A100 100 0 0 1 133.4 205" fill="none" stroke="#EF4444" stroke-width="3"/>

  <!-- 速度空间：原点与两个速度 -->
  <circle cx="420" cy="355" r="4.5" fill="#F1F5F9"/>
  <text x="408" y="382" fill="#94A3B8" font-size="13">0</text>
  <line x1="420" y1="355" x2="620" y2="355" stroke="#94A3B8" stroke-width="2.2"/>
  <polygon points="620,355 605,349 605,361" fill="#94A3B8"/>
  <text x="632" y="360" fill="#F1F5F9" font-size="14"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace">v_A</text>
  <line x1="420" y1="355" x2="220" y2="355" stroke="#94A3B8" stroke-width="2.2"/>
  <polygon points="220,355 235,349 235,361" fill="#94A3B8"/>
  <text x="168" y="360" fill="#F1F5F9" font-size="14"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace">v_B</text>

  <!-- u：v_A 到 VO 边界最近点 -->
  <line x1="620" y1="355" x2="320" y2="181.8" stroke="#EC4899" stroke-width="2.6"/>
  <polygon points="320,181.8 336,184 331,194" fill="#EC4899"/>
  <text x="600" y="300" fill="#EC4899" font-size="15"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace">u</text>

  <!-- 中点 = v_A + u/2 -->
  <circle cx="470" cy="268.4" r="5" fill="#22D3EE"/>
  <text x="352" y="252" fill="#22D3EE" font-size="13"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace">v_A + u/2</text>

  <!-- ORCA 边界：过中点、方向 ⟂ u -->
  <line x1="315.1" y1="0" x2="574.8" y2="450" stroke="#22D3EE" stroke-width="2.6"/>

  <!-- 标注 -->
  <text x="24" y="30" fill="#F1F5F9" font-size="15" font-weight="600">ORCA 半平面</text>
  <text x="158" y="30" fill="#94A3B8" font-size="14">：边界过</text>
  <text x="228" y="30" fill="#94A3B8" font-size="14"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace">v_A + u/2</text>
  <text x="330" y="30" fill="#94A3B8" font-size="14">，方向 ⟂ u</text>

  <text x="596" y="70" fill="#3B82F6" font-size="14">允许侧</text>
  <text x="596" y="90" fill="#94A3B8" font-size="12">（含</text>
  <text x="626" y="90" fill="#94A3B8" font-size="12"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace">v_A</text>
  <text x="662" y="90" fill="#94A3B8" font-size="12">）</text>

  <text x="96" y="150" fill="#EF4444" font-size="14">VO 边界</text>
  <text x="96" y="170" fill="#EF4444" font-size="12">（v 落在这里 = τ 内撞）</text>

  <text x="404" y="108" fill="#94A3B8" font-size="12">截断圆：圆心</text>
  <text x="484" y="108" fill="#94A3B8" font-size="12"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace">v_B + p/τ</text>
  <text x="570" y="108" fill="#94A3B8" font-size="12">，半径 R/τ</text>

  <text x="24" y="418" fill="#94A3B8" font-size="12">本图是文章算例的真实坐标：v_A=(1,0)、B 在 (0,2) 速度 (−1,0)、半径各 0.5、τ=2</text>
  <text x="24" y="438" fill="#94A3B8" font-size="12">⇒ u=(−1.5, 0.866)、Direction=(−0.5, −0.866)、Point = v_A + u/2 = (0.25, 0.433)</text>
</svg>
