<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 450" width="780" height="450"
     font-family="'DM Sans', -apple-system, system-ui, sans-serif">
  <rect width="780" height="450" fill="#0F172A"/>

  <!-- VO 区域 = 截断圆远弧 + 两条腿围成的部分（外侧） -->
  <path d="M249 97.1 A150 150 0 0 1 358.8 332.6 L780 379.4 L780 0 L324.1 0 Z"
        fill="#EF4444" fill-opacity="0.20" stroke="none"/>

  <!-- 截断圆（圆点 = (pB-pA)/τ，半径 = R/τ） -->
  <circle cx="371.9" cy="183.2" r="150" fill="none" stroke="#94A3B8" stroke-width="1.2"
          stroke-dasharray="7 5"/>

  <!-- 两条腿 = 原点出发的外侧公切线 -->
  <line x1="100" y1="320" x2="324.1" y2="0" stroke="#F59E0B" stroke-width="2.2"/>
  <line x1="100" y1="320" x2="780" y2="379.4" stroke="#F59E0B" stroke-width="2.2"/>

  <!-- 截断圆的远弧（VO 的"盖"） -->
  <path d="M249 97.1 A150 150 0 0 1 358.8 332.6" fill="none" stroke="#EF4444" stroke-width="3"/>

  <!-- 原点 -->
  <circle cx="100" cy="320" r="5" fill="#F1F5F9"/>
  <text x="66" y="352" fill="#94A3B8" font-size="13">原点</text>
  <text x="112" y="352" fill="#F1F5F9" font-size="13"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace">v_rel = 0</text>

  <!-- 圆心 c -->
  <circle cx="371.9" cy="183.2" r="4" fill="#94A3B8"/>
  <text x="392" y="178" fill="#94A3B8" font-size="13"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace">c = (p_B - p_A) / τ</text>

  <!-- 半径 -->
  <line x1="371.9" y1="183.2" x2="507.8" y2="119.8" stroke="#94A3B8" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="498" y="106" fill="#94A3B8" font-size="13"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace">R / τ</text>

  <!-- 危险：v_rel 落在锥里 -->
  <line x1="100" y1="320" x2="560" y2="160" stroke="#EF4444" stroke-width="2.6"/>
  <polygon points="560,160 544,162 549,172" fill="#EF4444"/>
  <text x="566" y="152" fill="#EF4444" font-size="14"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace">v_rel</text>
  <text x="566" y="174" fill="#EF4444" font-size="13">落在锥里 ⇒ τ 内必撞</text>

  <!-- 安全：在锥外 -->
  <line x1="100" y1="320" x2="170" y2="130" stroke="#22D3EE" stroke-width="2.6"/>
  <polygon points="170,130 156,137 164,145" fill="#22D3EE"/>
  <text x="182" y="132" fill="#22D3EE" font-size="13">锥外 ⇒ 安全</text>

  <!-- 腿 -->
  <text x="30" y="120" fill="#F59E0B" font-size="13">腿 = 外侧公切线</text>
  <text x="640" y="412" fill="#F59E0B" font-size="13">腿</text>

  <!-- 截断的含义 -->
  <text x="112" y="404" fill="#94A3B8" font-size="13">圆弧内侧（靠近原点）= 速度太慢，τ 秒内到不了</text>
  <text x="112" y="426" fill="#94A3B8" font-size="13">⇒ 这一段不属于 VO</text>

  <!-- 标题 -->
  <text x="24" y="30" fill="#F1F5F9" font-size="15" font-weight="600">速度障碍 VO(A|B)</text>
  <text x="196" y="30" fill="#94A3B8" font-size="14">：τ 秒内会撞的相对速度集合（相对速度空间）</text>
</svg>
