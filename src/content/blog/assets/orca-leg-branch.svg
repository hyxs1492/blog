<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" width="900" height="680"
     font-family="'DM Sans', -apple-system, system-ui, sans-serif">
  <!--
    相对速度空间：p = (0,2)、R = 1、τ = 2 ⇒ c = p/τ = (0,1)、r = R/τ = 0.5
      切点 = (±0.4330127, 0.75)（距锥顶 0.866）；腿方向 = (±0.5, 0.866)
    两个算例（都落在「最近点在腿上」）：
      ① v = (0, 2)     ：w = (0,1)、w·p = 2 > 0（不走近弧），det(p,w) = 0 ⇒ 代码取右腿
         D = (-0.5,-0.866)、v·D = -1.7320508、u = (0.8660254,-0.5)、|u| = 1、垂足 = (0.8660254,1.5)
         M = v + u/2 = (0.4330127, 1.75)
      ② v = (-√3, 1)   ：w = (-1.7320508, 0)、w·p = 0、det(p,w) = 3.4641016 > 0 ⇒ 左腿
         D = (-0.5, 0.8660254)、v·D = 1.7320508、u = (0.8660254, 0.5)、|u| = 1、垂足 = (-0.8660254,1.5)
         M = v + u/2 = (-1.2990381, 1.25)
      两个垂足到锥顶都是 1.732 > 切点距离 0.866 ⇒ 落在腿上有效的那一段 ✓
    像素：1 单位 = 170 px，锥顶 = (470, 560)
  -->
  <rect width="900" height="680" fill="#0F172A"/>

  <!-- 坐标轴 -->
  <g stroke="#334155" stroke-width="1.2">
    <line x1="60" y1="560" x2="850" y2="560"/>
    <line x1="470" y1="600" x2="470" y2="100"/>
  </g>

  <!-- 圆锥：两条腿 + 截断圆 + 近弧/远弧 -->
  <line x1="470" y1="560" x2="747.1" y2="80" stroke="#F59E0B" stroke-width="2.2"/>
  <line x1="470" y1="560" x2="192.9" y2="80" stroke="#F59E0B" stroke-width="2.2"/>
  <circle cx="470" cy="390" r="85" fill="none" stroke="#64748B" stroke-width="1.4" stroke-dasharray="6 5"/>
  <path d="M543.6 432.5 A85 85 0 0 0 396.4 432.5" fill="none" stroke="#64748B" stroke-width="1.6"/>
  <path d="M543.6 432.5 A85 85 0 0 1 396.4 432.5" fill="none" stroke="#EF4444" stroke-width="3"/>
  <circle cx="543.6" cy="432.5" r="3" fill="#F59E0B"/>
  <circle cx="396.4" cy="432.5" r="3" fill="#F59E0B"/>
  <circle cx="470" cy="390" r="3.5" fill="#94A3B8"/>
  <text x="478" y="386" fill="#94A3B8" font-size="12"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace">c = p/τ</text>

  <!-- 允许侧（算例①：锚点在 v + u/2，允许侧含垂足） -->
  <path d="M394.9 520 L637.4 100 L860 100 L860 520 Z" fill="#3B82F6" fill-opacity="0.10"/>

  <!-- 算例①：正对着开，走右腿 -->
  <line x1="470" y1="390" x2="470" y2="220" stroke="#22D3EE" stroke-width="2"/>
  <polygon points="470,220 465.5,234 474.5,234" fill="#22D3EE"/>
  <text x="478" y="306" fill="#22D3EE" font-size="13"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace">w</text>
  <line x1="470" y1="220" x2="617.2" y2="305" stroke="#EC4899" stroke-width="2.6"/>
  <polygon points="617.2,305 608.4,294.2 603.4,302.8" fill="#EC4899"/>
  <polyline points="609.4,300.5 613.9,292.7 621.7,297.2" fill="none" stroke="#EC4899" stroke-width="1.2"/>
  <text x="536" y="248" fill="#EC4899" font-size="13" paint-order="stroke" stroke="#0F172A" stroke-width="3.5"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace">u</text>
  <circle cx="470" cy="220" r="4.5" fill="#F1F5F9"/>
  <text x="482" y="214" fill="#F1F5F9" font-size="12.5" paint-order="stroke" stroke="#0F172A" stroke-width="3.5"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace">v = (0, 2)</text>
  <circle cx="617.2" cy="305" r="4.5" fill="#F1F5F9"/>
  <text x="628" y="322" fill="#F1F5F9" font-size="12" paint-order="stroke" stroke="#0F172A" stroke-width="3.5">垂足 = VO 边界最近点</text>

  <!-- 算例①的 ORCA 边界与锚点 -->
  <line x1="543.6" y1="262.5" x2="468.6" y2="392.5" stroke="#22D3EE" stroke-width="1.6" stroke-opacity="0.85"/>
  <line x1="543.6" y1="262.5" x2="618.6" y2="132.5" stroke="#22D3EE" stroke-width="1.6" stroke-opacity="0.85"/>
  <circle cx="543.6" cy="262.5" r="5" fill="#22D3EE"/>
  <text x="556" y="256" fill="#22D3EE" font-size="12.5" paint-order="stroke" stroke="#0F172A" stroke-width="3.5"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace">v + u/2</text>
  <text x="700" y="170" fill="#3B82F6" font-size="12.5" paint-order="stroke" stroke="#0F172A" stroke-width="3.5">允许侧（各让一半）</text>

  <!-- 算例②：擦身而过，走左腿 -->
  <!-- 算例②的允许侧：在它自己那条青线的「左下」—— 与①的「右下」相反，
       说明允许侧不是"屏幕右侧"，而是 D 的左手边（D 朝左上 ⇒ 左手边朝左下） -->
  <path d="M106.3 100 L348.8 520 L60 520 L60 100 Z" fill="#3B82F6" fill-opacity="0.10"/>
  <text x="66" y="440" fill="#3B82F6" font-size="12.5" paint-order="stroke" stroke="#0F172A" stroke-width="3.5">允许侧（②）</text>
  <line x1="470" y1="390" x2="175.6" y2="390" stroke="#22D3EE" stroke-width="2"/>
  <polygon points="175.6,390 189.6,385.5 189.6,394.5" fill="#22D3EE"/>
  <text x="316" y="380" fill="#22D3EE" font-size="13"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace">w</text>
  <line x1="175.6" y1="390" x2="322.8" y2="305" stroke="#EC4899" stroke-width="2.6"/>
  <polygon points="322.8,305 314,315.8 309,307.2" fill="#EC4899"/>
  <polyline points="315,309.5 310.5,301.7 318.3,297.2" fill="none" stroke="#EC4899" stroke-width="1.2"/>
  <text x="214" y="368" fill="#EC4899" font-size="13" paint-order="stroke" stroke="#0F172A" stroke-width="3.5"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace">u</text>
  <circle cx="175.6" cy="390" r="4.5" fill="#F1F5F9"/>
  <text x="60" y="384" fill="#F1F5F9" font-size="12.5" paint-order="stroke" stroke="#0F172A" stroke-width="3.5"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace">v = (−1.73, 1)</text>
  <circle cx="322.8" cy="305" r="4.5" fill="#F1F5F9"/>
  <circle cx="249.2" cy="347.5" r="5" fill="#22D3EE"/>
  <text x="140" y="330" fill="#22D3EE" font-size="12.5" paint-order="stroke" stroke="#0F172A" stroke-width="3.5"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace">v + u/2</text>
  <line x1="249.2" y1="347.5" x2="174.2" y2="217.5" stroke="#22D3EE" stroke-width="1.6" stroke-opacity="0.85"/>
  <line x1="249.2" y1="347.5" x2="324.2" y2="477.5" stroke="#22D3EE" stroke-width="1.6" stroke-opacity="0.85"/>

  <!-- 腿 / 锥顶 / 判据 -->
  <text x="662" y="238" fill="#F59E0B" font-size="12.5" paint-order="stroke" stroke="#0F172A" stroke-width="3.5">右腿</text>
  <text x="212" y="238" fill="#F59E0B" font-size="12.5" paint-order="stroke" stroke="#0F172A" stroke-width="3.5">左腿</text>
  <text x="548" y="446" fill="#F59E0B" font-size="11" paint-order="stroke" stroke="#0F172A" stroke-width="3.5">切点</text>
  <circle cx="470" cy="560" r="5" fill="#F1F5F9"/>
  <text x="480" y="578" fill="#94A3B8" font-size="12">锥顶（相对速度 v = 0）</text>
  <path d="M470 440 A120 120 0 0 1 530 456" fill="none" stroke="#F1F5F9" stroke-width="1.2" stroke-opacity="0.85"/>
  <text x="486" y="452" fill="#F1F5F9" font-size="12.5" paint-order="stroke" stroke="#0F172A" stroke-width="3"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace">α</text>
  <text x="538" y="478" fill="#94A3B8" font-size="11.5" paint-order="stroke" stroke="#0F172A" stroke-width="3.5">腿方向 = p 转 ±α（α 是锥半角）</text>
  <text x="24" y="470" fill="#F1F5F9" font-size="12.5"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace">det(p,w) &gt; 0 ⇒ 左腿　det(p,w) ≤ 0 ⇒ 右腿</text>
  <text x="24" y="492" fill="#94A3B8" font-size="11.5">（① 是正对着开的对称特例：det = 0，两条腿等距）</text>

  <!-- 标题与图注 -->
  <text x="24" y="34" fill="#F1F5F9" font-size="15" font-weight="600">腿分支：最近点落在腿上，怎么选、怎么挪</text>
  <text x="24" y="58" fill="#94A3B8" font-size="12.5"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace">p = (0, 2)　R = 1　τ = 2　⇒　c = p/τ = (0, 1)、r = R/τ = 0.5、切点距锥顶 0.866</text>

  <text x="24" y="600" fill="#94A3B8" font-size="12">① 选哪条腿由 det(p, w) 的符号定（w = v − p/τ）：正值 ⇒ 左腿，否则右腿。图里①正对着开，det = 0，代码按 ≤ 0 取右腿。</text>
  <text x="24" y="622" fill="#94A3B8" font-size="12">② u 就是「把 v 垂直投影到腿上，再减回 v」：u = (v·D)·D − v，所以 u ⟂ D（D 是这条腿的单位方向），|u| 就是 v 到腿的距离。</text>
  <text x="24" y="644" fill="#94A3B8" font-size="12">③ 垂足要落在切点之外的那一段腿上（两个算例的垂足距锥顶 1.73 &gt; 0.87 ✓）；锚点照旧 = 当前速度 + u/2，青线与该腿平行。</text>
</svg>
