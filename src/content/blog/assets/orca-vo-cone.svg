<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 660" width="760" height="660"
     font-family="'DM Sans', -apple-system, system-ui, sans-serif">
  <rect width="760" height="660" fill="#0F172A"/>

  <defs>
    <!-- 「被截断圆切掉」的那块用斜纹表示：速度太慢，τ 秒内追不上（不属于 VO） -->
    <pattern id="cutHatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="7" height="7" fill="#16213A"/>
      <line x1="0" y1="0" x2="0" y2="7" stroke="#48597A" stroke-width="1.8"/>
    </pattern>
  </defs>

  <!--
    坐标系：横纵轴 = 相对速度 v 的两个分量（相对速度空间）。
    按 p = (0, 2)、R = rA + rB = 1、τ = 2 精确作图 ⇒
      圆心 = p/τ = (0,1)，距原点 1 个单位；半径 = R/τ = 0.5 个单位
      切线半角 = asin((R/τ) / (|p|/τ)) = asin(R/|p|) = asin(0.5) = 30°
      切点距原点 = √(1² − 0.5²) = √3/2 ≈ 0.866 个单位
    比例：1 个单位 = 220 px；原点 (380,510)、圆心 (380,290)、半径 110 px
    切点 = 圆心 + 110·(cos150°, sin150°) 等 = (284.737, 345) / (475.263, 345)
  -->

  <!-- VO 区域 = 两条腿之间、截断圆近弧之外的部分（截断圆盘本身也在其中：τ 秒内正好撞上） -->
  <path d="M284.737 345 A110 110 0 0 0 475.263 345 L639.81 60 L120.19 60 Z"
        fill="#EF4444" fill-opacity="0.20" stroke="none"/>

  <!-- 被切掉的那块：圆锥内、截断圆近弧与原点之间（两条腿 + 近弧自然围出这个区域） -->
  <path d="M380 510 L284.737 345 A110 110 0 0 0 475.263 345 Z" fill="url(#cutHatch)"/>
  <rect x="348" y="424" width="64" height="17" rx="3" fill="#0F172A"/>
  <text x="380" y="436.5" fill="#CBD5E1" font-size="10.5" text-anchor="middle">不属于 VO</text>

  <!-- 截断圆（圆心 = (pB-pA)/τ，半径 = R/τ） -->
  <circle cx="380" cy="290" r="110" fill="none" stroke="#94A3B8" stroke-width="1.2"
          stroke-dasharray="7 5"/>

  <!-- 两条腿 = 原点出发的外侧公切线 -->
  <line x1="380" y1="510" x2="120.19" y2="60" stroke="#F59E0B" stroke-width="2.2"/>
  <line x1="380" y1="510" x2="639.81" y2="60" stroke="#F59E0B" stroke-width="2.2"/>

  <!-- 截断圆的近弧（面向原点的那一段）= VO 的内边界 -->
  <path d="M284.737 345 A110 110 0 0 0 475.263 345" fill="none" stroke="#EF4444" stroke-width="3"/>

  <!-- 原点（= 相对不动） -->
  <circle cx="380" cy="510" r="5" fill="#F1F5F9"/>
  <text x="318" y="532" fill="#94A3B8" font-size="13">原点</text>
  <text x="392" y="532" fill="#F1F5F9" font-size="13"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace">v_rel = 0</text>

  <!-- 圆心 c -->
  <circle cx="380" cy="290" r="4" fill="#94A3B8"/>
  <text x="392" y="286" fill="#94A3B8" font-size="13"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace">c = p/τ</text>

  <!-- 半径 -->
  <line x1="380" y1="290" x2="380" y2="400" stroke="#94A3B8" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="392" y="352" fill="#94A3B8" font-size="13"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace">R/τ</text>

  <!-- 危险：v_rel 落在锥里且够快 ⇒ 落进截断圆盘 ⇒ τ 内必撞 -->
  <line x1="380" y1="510" x2="465" y2="350" stroke="#EF4444" stroke-width="2.6"/>
  <polygon points="465,350 453.1,359.6 463.7,365.2" fill="#EF4444"/>
  <text x="492" y="346" fill="#EF4444" font-size="14"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace">v_rel</text>
  <text x="492" y="368" fill="#EF4444" font-size="13">落在锥里 ⇒ τ 内必撞</text>

  <!-- 安全：在锥外 -->
  <line x1="380" y1="510" x2="226.8" y2="381.4" stroke="#22D3EE" stroke-width="2.6"/>
  <polygon points="226.8,381.4 233.6,395 241.4,385.8" fill="#22D3EE"/>
  <text x="112" y="390" fill="#22D3EE" font-size="13">锥外 ⇒ 安全</text>

  <!-- 腿 -->
  <text x="24" y="140" fill="#F59E0B" font-size="13">腿 = 外侧公切线</text>
  <text x="622" y="140" fill="#F59E0B" font-size="13">腿</text>

  <!-- 截断的含义 -->
  <text x="24" y="600" fill="#94A3B8" font-size="13">灰色斜纹 = 截断圆切掉的部分：速度太慢，τ 秒内追不上 ⇒ 不属于 VO</text>
  <text x="24" y="622" fill="#94A3B8" font-size="13">截断圆盘本身 = τ 秒内正好撞上 ⇒ 属于 VO</text>

  <!-- 标题 -->
  <text x="24" y="34" fill="#F1F5F9" font-size="15" font-weight="600">速度障碍 VO(A|B)</text>
  <text x="196" y="34" fill="#94A3B8" font-size="14">：τ 秒内会撞的相对速度集合（相对速度空间）</text>
</svg>
